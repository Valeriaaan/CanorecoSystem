<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../resources/images/canoreco.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../resources/css/style.css">
    <title>View News &#8211; CANORECO</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div class="container-fluid px-0">

        <!-- Top App Bar -->
        <nav
            class="top-nav navbar navbar-expand-lg border-bottom border-body fixed-top d-flex flex-wrap align-items-center justify-content-center justify-content-md-between px-md-5">
            <div class="container-fluid">

                <a href="#" class="d-flex align-items-center mb-md-0 me-md-auto text-decoration-none">
                    <img src="../../resources/images/canoreco.png" alt="Logo" style="width: 24px;">
                    <span class="fs-5 fw-bold d-none d-sm-inline ms-2 top-nav">CANORECO</span>
                </a>

                <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0 me-5 pe-5">
                    <li><a href="home.html#home" class="nav-link px-2 ">Home</a></li>
                    <li><a href="home.html#maintenance" class="nav-link px-2">Maintenance</a></li>
                    <li><a href="home.html#news" class="nav-link px-2 me-5 pe-5">News</a></li>
                </ul>

                <div class="col-md-3 text-end">
                    <a href="login.html" class="btn btn-main me-2">Login</a>

                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container-fluid mt-5 pt-3">
            <div class="row p-4 pb-0">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold">View News</h4>
                    <a href="javascript:void(0);" onclick="window.history.back();" class="btn btn-secondary"
                        role="button">
                        <span class="d-none d-sm-inline">Back</span>
                        <i class="fas fa-arrow-left d-inline d-sm-none"></i>
                    </a>

                </div>

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-chevron">
                        <li class="breadcrumb-item">
                            <a class="link-body-emphasis" href="home.html">
                                <i class="fas fa-house fa-sm"></i><span class="visually-hidden">Home</span>
                            </a>
                        </li>
                        <li class="breadcrumb-item">
                            <a class="link-body-emphasis fw-semibold text-decoration-none" href="home.html">Home</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">
                            View News
                        </li>
                    </ol>
                </nav>
            </div>

            <div class="row p-4 pt-0 flex-column flex-lg-row">

                <!-- News Container -->
                <div class="card shadow-sm p-2">
                    <div class="card-body">
                        <div class="col-lg-8 col-md-8 mx-auto">
                            <div class="lh-lg my-3" id="newsContainer">
                                <!-- News content will be dynamically inserted here -->
                            </div>
                            <!-- Loading Spinner -->
                            <div id="loadingSpinner" class="d-flex justify-content-center align-items-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


            </div>

        </div>

    </div>


    <!-- Scripts -->
    <script src="../../resources/js/config.js" type="module"></script>
    <script src="resources/js/view-news.js" type="module"></script>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
