<!DOCTYPE html>
<html> 

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../resources/images/canoreco.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../resources/css/style.css">
    <title>Add Bayad Center &#8211; CANORECO</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div class="container-fluid px-0">
        <div class="row gx-0 flex-nowrap">

            <!-- Sidebar -->
            <div class="col-auto col-md-3 col-xl-2 px-0 position-sticky sticky-top h-100">
                <div id="side-nav"></div>
            </div>

            <!-- Main content and Top App Bar -->
            <div class="col d-flex flex-column">

                <!-- Top App Bar -->
                <nav class="top-nav navbar navbar-expand-lg border-bottom border-body fixed-top">
                    <div class="container-fluid">

                        <a href="#" class="d-flex align-items-center mb-md-0 me-md-auto text-decoration-none">
                            <img src="../../resources/images/canoreco.png" alt="Logo" style="width: 24px;">
                            <span class="fs-5 fw-bold d-none d-sm-inline ms-2 top-nav">CANORECO</span>
                        </a>
                        
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation" style="border: 2px solid white;">
                            <span class="fas fa-bars text-light"></span>
                        </button>

                        <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                            <ul class="navbar-nav">
                                <li class="nav-item dropdown me-1">
                                    <a class="nav-link top-nav" href="#" id="navbarNotifications" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fas fa-bell"></i>
                                        <span class="border border-light p-1 rounded-circle bg-danger" id="notificationBadge" style="position: absolute; top: 7px; right: 4.5px; display: none;"></span>
                                        <span class="d-inline d-lg-none ms-1 fw-medium">Notifications</span>
                                    </a>
                                    <ul id="notificationDropdown" class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarNotifications">
                                        <li><p class="dropdown-item text-muted mb-0">No new notifications</p></li>
                                    </ul>
                                </li>

                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle top-nav" href="#" id="navbarProfile" role="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <img src="https://github.com/mdo.png" id="userProfilePicture" alt="Profile" width="30" height="30" class="border border-1 rounded-circle">
                                        <span id="userFullName" class="ms-1 fw-medium"></span>
                                    </a>

                                    <ul class="dropdown-menu dropdown-menu-end " aria-labelledby="navbarProfile">
                                        <li><a class="dropdown-item text-dark" href="../profile/profile.html">Profile</a></li>
                                        <li><a class="dropdown-item text-dark" href="#">Settings</a></li>
                                        <li><a class="dropdown-item text-dark" href="#" id="logout">Sign out</a></li> 
                                    </ul>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>

                <!-- Main Content -->
                <div class="container-fluid mt-5 pt-3">
                    <div class="row">
                        <div class="col-lg-5 col-md-6 p-4">

                            <h4 class="fw-bold">Add Bayad Center</h4>

                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb breadcrumb-chevron">
                                    <li class="breadcrumb-item">
                                        <a class="link-body-emphasis" href="../dashboard/dashboard.html">
                                            <i class="fas fa-house fa-sm"></i><span class="visually-hidden">Home</span>
                                        </a>
                                    </li>
                                    <li class="breadcrumb-item fw-semibold" aria-current="page">
                                        Center
                                    </li>
                                    <li class="breadcrumb-item">
                                        <a class="link-body-emphasis fw-semibold text-decoration-none"
                                            href="../centers/bayad-center.html">Bayad Center</a>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">
                                        Add Bayad Center
                                    </li>
                                </ol>
                            </nav>
                            
                            <div class="row">
                                <form class="left-container overflow-y-auto mb-3 needs-validation  d-none" id="addBayadCenterForm" novalidate>
                                    <div class="mb-3">
                                        <label for="locationName" class="form-label">Location Name</label>
                                        <input type="text" class="form-control" id="locationName" placeholder="Enter location name" required>
                                        <div class="invalid-feedback">
                                            Please provide a location name.
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="municipality" class="form-label">Municipality
                                            <span class="far fa-circle-question fa-sm text-muted ms-1"data-bs-toggle="popover" data-bs-placement="right" 
                                                data-bs-trigger="hover focus" data-bs-custom-class="custom-popover" data-bs-title="Select Location" 
                                                data-bs-content="Please select a location on the map.">
                                            </span>
                                        </label>
                                        <input type="text" class="form-control" id="municipality" placeholder="Municipality" autocomplete="cc-exp-month" readonly>
                                    </div>
                                    <div class="mb-3">
                                        <label for="barangay" class="form-label">Barangay 
                                            <span class="far fa-circle-question fa-sm text-muted ms-1"data-bs-toggle="popover" data-bs-placement="right" 
                                                data-bs-trigger="hover focus" data-bs-custom-class="custom-popover" data-bs-title="Select Location" 
                                                data-bs-content="Please select a location on the map.">
                                            </span>
                                        </label>
                                        <input type="text" class="form-control" id="barangay" placeholder="Barangay" autocomplete="cc-exp-month" readonly>
                                    </div>
                                    <div class="mb-3">
                                        <label for="street" class="form-label">Street <span class="text-muted">(Optional)</span></label>
                                        <input type="text" class="form-control" id="street" placeholder="Street" autocomplete="cc-exp-month">
                                    </div>
                                    <div class="mb-3">
                                        <label for="unit" class="form-label">Unit/Flr #, Bldg Name, Blk or Lot # <span class="text-muted">(Optional)</span></label>
                                        <input type="text" class="form-control" id="unit" placeholder="Enter complete location address" >
                                    </div>
                                
                                    <button type="submit" class="btn btn-main mb-3">Save Bayad Center</button>
                                </form>
                            </div>

                        </div>

                        <div class="d-flex flex-column col-lg-7 col-md-6 border-start bg-white pb-0">
                            <a href="javascript:void(0);" onclick="window.history.back();" class="btn btn-secondary align-self-end m-3 px-lg-4" role="button">
                                <span class="d-none d-sm-inline">Back</span>
                                <i class="fas fa-arrow-left d-inline d-sm-none"></i>
                            </a>

                            <!-- Loading Spinner -->
                            <div id="loadingSpinner" class="d-flex justify-content-center align-items-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>

                            <div class="rounded mb-5 mx-3 d-none" id="map"></div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="../../resources/js/main.js" type="module"></script>
    <script src="../../resources/js/config.js" type="module"></script>
    <script src="../centers/js/add-bayad-center.js" type="module"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD3tKIFW5fz6j-ED1kFVD_VY7RRtGRDQtQ&loading=async&callback=initMap" async defer></script>

</body>

</html>
