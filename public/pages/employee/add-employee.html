<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../resources/images/canoreco.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.3/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="../../resources/css/style.css">
    <title>Add Employee &#8211; CANORECO</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div class="container-fluid px-0">
        <div class="row gx-0 flex-nowrap">

            <!-- Sidebar -->
            <div class="col-auto col-md-3 col-xl-2 px-0 position-sticky sticky-top h-100">
                <div id="side-nav"></div>
            </div>

            <!-- Main content and Top App Bar -->
            <div class="col d-flex flex-column">

                <!-- Top App Bar -->
                <nav class="top-nav navbar navbar-expand-lg border-bottom border-body">
                    <div class="container-fluid">

                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                            <ul class="navbar-nav">
                                <li class="nav-item dropdown me-1">
                                    <a class="nav-link" href="#" id="navbarNotifications" role="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fas fa-bell"></i>
                                    </a>
                                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarNotifications">
                                        <li><a class="dropdown-item" href="#">Notification 1</a></li>
                                        <li><a class="dropdown-item" href="#">Notification 2</a></li>
                                        <li><a class="dropdown-item" href="#">Notification 3</a></li>
                                    </ul>
                                </li>
                                
                                <li class="nav-item dropdown me-1">
                                    <a class="nav-link" href="#" id="navbarMessages" role="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fas fa-envelope"></i>
                                    </a>
                                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarMessages">
                                        <li><a class="dropdown-item" href="#">Message 1</a></li>
                                        <li><a class="dropdown-item" href="#">Message 2</a></li>
                                        <li><a class="dropdown-item" href="#">Message 3</a></li>
                                    </ul>
                                </li>

                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" id="navbarProfile" role="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <img src="https://github.com/mdo.png" id="userProfilePicture" alt="Profile" width="30" height="30"
                                            class="rounded-circle">
                                            <span id="userFullName" class="ms-1 fw-medium"></span>
                                    </a>

                                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarProfile">
                                        <li><a class="dropdown-item" href="#">Profile</a></li>
                                        <li><a class="dropdown-item" href="#">Settings</a></li>
                                        <li><a class="dropdown-item" href="#" id="logout">Sign out</a></li>
                                    </ul>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>

                <!-- Main Content -->
                <div class="container-fluid">
                    <div class="row flex-nowrap">
                        <div class="col p-4">

                            <div class="d-flex justify-content-between align-items-center">
                                <h4 class="fw-bold">Add Employee</h4>
                                <a href="add-employee.html" class="btn btn-main"  role="button">Add Employee</a>
                            </div>
                            
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb breadcrumb-chevron">
                                    <li class="breadcrumb-item">
                                        <a class="link-body-emphasis" href="../dashboard/dashboard.html">
                                            <i class="fas fa-house fa-sm"></i><span class="visually-hidden">Home</span>
                                        </a>
                                    </li>
                                    <li class="breadcrumb-item">
                                        <a class="link-body-emphasis fw-semibold text-decoration-none" href="employee.html">Employee</a>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">
                                        Add Employee
                                    </li>
                                </ol>
                            </nav>

                            <!-- Data Table Card -->
                            <form id="addEmployeeForm" class="mt-4">
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="address" class="form-label">Address</label>
                                    <input type="text" class="form-control" id="address" required>
                                </div>
                                <div class="mb-3">
                                    <label for="contactNumber" class="form-label">Contact Number</label>
                                    <input type="tel" class="form-control" id="contactNumber" required>
                                </div>
                                <div class="mb-3">
                                    <label for="birthdate" class="form-label">Birthdate</label>
                                    <input type="date" class="form-control" id="birthdate" required>
                                </div>
                                <div class="mb-3">
                                    <label for="profilePicture" class="form-label">Profile Picture</label>
                                    <input type="file" class="form-control" id="profilePicture" accept="image/*" required>
                                    <img id="profilePicturePreview" class="mt-3 img-fluid" alt="Profile Picture Preview" style="display:none;">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Add Employee</button>
                            </form>


                        </div>
                    </div>
                </div>
                
                <!-- Footer -->
                <!-- <footer class="mt-auto footer p-3 border-top">
                    <p class="text-muted mb-2">© 2024 CANORECO. All Rights Reserved.</p>
                </footer> -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../../resources/js/main.js" type="module"></script>
    <script src="../../resources/js/config.js" type="module"></script>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.datatables.net/2.1.3/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.1.3/js/dataTables.bootstrap5.js"></script>

    <script>

        // Profile picture preview
        $('#profilePicture').on('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    $('#profilePicturePreview').attr('src', e.target.result).show();
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>
