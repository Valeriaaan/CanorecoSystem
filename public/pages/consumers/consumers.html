                                    </ul>

                                    </a>

                                    <ul class="dropdown-menu dropdown-menu-end " aria-labelledby="navbarProfile">
                                        <li><a class="dropdown-item text-dark" href="../profile/profile.html">Profile</a></li>

                            </ul>

                                <h4 class="fw-bold">Consumers</h4>
                                <a href="add-consumer.html" class="btn btn-main" role="button">

                                        </a>

                                    </li>
                                </ol>
                            </nav>

                                                <th>Address</th>
                                                <th>Contact Number</th>
                                                <th>Status</th>
                                                <th data-priority="2">Actions</th>
                                            </tr>
                                        </thead>
