<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="resources/images/canoreco.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="resources/css/style.css">
    <title>CANORECO Register</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="header" class="bg-white"></div>

    <div class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card my-5">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Register</h3>

                        <form id="registerForm" class="needs-validation" novalidate>

                            <div class="mb-3">
                                <label for="fullname" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Enter your full name" required>
                                <div class="invalid-feedback">
                                    Please enter your full name.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                <div class="invalid-feedback">
                                    Please enter a valid email address.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                <div class="invalid-feedback">
                                    Please enter your password.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                                <div class="invalid-feedback">
                                    Please confirm your password.
                                </div>
                            </div>
                            
                            <label for="mobile" class="form-label">Mobile Number</label>
                            <div class="mb-3 input-group">
                                <span class="input-group-text" id="number-addon">+63</span>
                                <input type="tel" class="form-control" id="mobile" placeholder="Enter your mobile number" required>
                                <div class="invalid-feedback">
                                    Please enter your mobile number.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="profilePicture" class="form-label">Profile Picture</label>
                                <input type="file" class="form-control" id="profilePicture" accept="image/*" required>
                                <div class="invalid-feedback">
                                    Please upload your profile picture.
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-main">Register</button>
                            </div>
                        </form>

                        <p class="text-center mt-3">Already have an account? <a href="index.html">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer" class="mt-auto bg-white"></div>

    <script defer src="resources/js/index.js" type="module"></script>
    <script defer src="resources/js/config.js" type="module"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
